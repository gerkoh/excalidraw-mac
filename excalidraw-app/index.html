<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Excalidraw-Mac App</title>
    <style>
      html,
      body,
      #root {
        height: 100%;
        margin: 0;
        overflow: hidden;
      }
      /* follows nativeTheme.themeSource; matches the BrowserWindow backgroundColor until Excalidraw paints */
      :root {
        color-scheme: light dark;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background-color: #121212;
        }
      }
    </style>
    <script>
      // load fonts
      const base = new URL(".", window.location.href).href;
      window.EXCALIDRAW_ASSET_PATH = base;
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
